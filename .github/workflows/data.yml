# 収集日データの取り込み：取得 → 変換 → チェック → GitHub Pages に配信（週 1 回）
# 事前の設定：リポジトリの Settings → Pages → Source を「GitHub Actions」にする。
name: data

on:
  schedule:
    - cron: "0 18 * * 0" # 毎週月曜 3:00（日本時間）
  workflow_dispatch:
  push:
    branches: [main]
    paths: ["pipeline/**", ".github/workflows/data.yml"]

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: pages
  cancel-in-progress: false

jobs:
  build:
    runs-on: ubuntu-latest
    outputs:
      partial: ${{ steps.build.outputs.partial }}
    defaults:
      run:
        working-directory: pipeline
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.13"
          cache: pip
          cache-dependency-path: pipeline/requirements.txt
      - run: pip install -r requirements.txt
      - name: テスト
        run: python -m unittest discover -s tests -t .
      - name: 取得・変換・チェック
        id: build
        env:
          PREVIOUS: https://${{ github.repository_owner }}.github.io/${{ github.event.repository.name }}
        run: |
          set +e
          python build.py --out ../site --previous "$PREVIOUS"
          code=$?
          cat ../site/report.md >> "$GITHUB_STEP_SUMMARY" 2>/dev/null
          # 2 = 一部の失敗（前回のデータで補って配信する）。それ以外のエラーは配信しない
          if [ $code -eq 2 ]; then echo "partial=true" >> "$GITHUB_OUTPUT"; exit 0; fi
          exit $code
      - uses: actions/upload-pages-artifact@v3
        with:
          path: site

  deploy:
    needs: build
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - id: deployment
        uses: actions/deploy-pages@v4

  # 一部の取り込みに失敗したら、配信のあとで赤くして知らせる（詳細は build の Summary）
  notify:
    needs: [build, deploy]
    if: needs.build.outputs.partial == 'true'
    runs-on: ubuntu-latest
    steps:
      - run: |
          echo "一部の取り込みに失敗しました。build ジョブの Summary（report.md）を見てください。"
          exit 1
